<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Get the Fokasu extension</title>
    <link rel="stylesheet" href="/extension/redirect.css" />
    <script src="/extension/redirect.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <span class="brand">FOKASU</span>
      <h1 id="title">Get the extension</h1>
      <p id="status" role="status">Choose your browser’s extension store.</p>
      <nav aria-label="Extension stores">
        <a href="https://chromewebstore.google.com/detail/fokasu/kcjhihkbhildakpnghknpomakellcngi">Chrome &amp; Chromium browsers</a>
        <a href="https://addons.mozilla.org/firefox/addon/fokasu/">Firefox</a>
      </nav>
      <noscript><p>Choose a store above, then return to Fokasu to finish setup.</p></noscript>
    </main>
  </body>
</html>
