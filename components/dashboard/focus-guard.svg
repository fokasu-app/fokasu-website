.guard-shield { fill: url(#guard-gradient-6); }
.guard-shield-glint { fill: #97f6c8; fill-opacity: .16; }
.guard-eye { fill: #203e3b; }
.guard-white { fill: #fffaf0; }
.guard-sparkle { fill: #ffe19a; }
.guard-line, .guard-detail, .guard-seam, .guard-shine, .guard-rim, .guard-rivet {
  fill: none;
  stroke: #29463e;
  stroke-width: 2.2px;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.guard-detail { stroke-width: 1.5px; }
.guard-seam { stroke: #78c4a8; stroke-width: 1.3px; }
.guard-shine { stroke: #c8ffdb; stroke-width: 3px; }
.guard-rim { stroke: #b7f4cc; stroke-width: 2px; }
.guard-rivet { stroke: #fff1bc; stroke-width: 2px; }
.guard-mouth-open { fill: #733e3c; stroke: #29463e; stroke-width: 1.6px; }
</style>
