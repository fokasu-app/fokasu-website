<style>.guard-shadow { fill: #000; fill-opacity: .28; }
.guard-cape, .guard-dark, .guard-skin, .guard-armor, .guard-shield-edge,
.guard-helmet, .guard-gold, .guard-shield {
  stroke: #173d37;
  stroke-width: 1.8px;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.guard-cape { fill: url(#guard-gradient-0); }
.guard-dark { fill: #203e3b; }
.guard-skin { fill: url(#guard-gradient-1); }
